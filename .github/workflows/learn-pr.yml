name: PR checks (learn)

# Tests for the student course site. Separate from the CRM checks so a change to one never waits for the other.
on:
  pull_request:
    paths:
      - 'learn-backend/**'
      - 'learn-frontend/**'
      - '.github/workflows/learn-pr.yml'

concurrency:
  group: learn-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: learn-backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: learn-backend/pom.xml

      # Testcontainers starts PostgreSQL 18; Docker is preinstalled on ubuntu-latest.
      - name: Test learn-backend
        working-directory: learn-backend
        run: ./mvnw -q -B test
