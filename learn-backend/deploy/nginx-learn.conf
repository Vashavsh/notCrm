# /etc/nginx/sites-available/learn.shabash-hub.ru  (symlink into sites-enabled)
# The course front end is static files; the API and the lesson pictures go to learn-backend on loopback.
# The browser sees one origin, so there is no CORS and the session cookie stays same-site.

# Only the login endpoint is rate limited here (the app has its own lockout as well).
limit_req_zone $binary_remote_addr zone=learn_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name learn.shabash-hub.ru;
    # certbot answers its challenge here; everything else goes to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.shabash-hub.ru;

    ssl_certificate     /etc/letsencrypt/live/learn.shabash-hub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.shabash-hub.ru/privkey.pem;

    root /opt/pipeline-learn/frontend/current;
    index index.html;

    # A picture of an open answer is at most 6 MB; the app refuses bigger ones with a readable message.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/login {
        limit_req zone=learn_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/learn-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/learn-proxy.conf;
    }

    # Pictures used by lessons: only logged-in students get them (the app checks), so no shared caching.
    location /assets/course/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/learn-proxy.conf;
    }

    # The front end's own files have hashed names and can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
