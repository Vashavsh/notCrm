server:
  port: ${SERVER_PORT:8081}
  # Behind nginx on the same host: listen on loopback only, so X-Forwarded-* headers can only come from nginx.
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: LEARN_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 90d

spring:
  application:
    name: pipeline-learn
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pipeline_crm}
    username: ${DB_USERNAME:learn_user}
    password: ${DB_PASSWORD:learn_pass}
    hikari:
      # Everything this app touches lives in its own schema; it must never resolve a name in the CRM's `public`.
      connection-init-sql: SET search_path TO learn
  servlet:
    multipart:
      # The application itself refuses images over 6 MB with a readable message; these limits only stop abuse.
      max-file-size: 7MB
      max-request-size: 8MB
  session:
    # Server-side sessions in learn.spring_session (created by Flyway V2): restarts do not log students out.
    timeout: 90d
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: learn
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Own migration history inside the `learn` schema, independent of the CRM's history in `public`.
    schemas: learn
    default-schema: learn
    create-schemas: true

learn:
  # Both live outside the repository. The app refuses to start when the content is missing or invalid.
  content-dir: ${LEARN_CONTENT_DIR:}
  secrets-dir: ${LEARN_SECRETS_DIR:}
